name: Sync CV to portfolio

  "on":
    release:
      types: [published]

  jobs:
    sync:
      runs-on: ubuntu-latest
      steps:
        - name: Download PDF from release
          run: |
            curl -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "https://github.com/kybeka/cv/releases/latest/download/KaplanKyla_CV.pdf" \
              -o KaplanKyla_CV.pdf

        - name: Checkout ship-of-theseus
          uses: actions/checkout@v4
          with:
            repository: kybeka/ship-of-theseus
            token: ${{ secrets.SHIP_REPO_TOKEN }}
            path: portfolio

        - name: Copy PDF into public/
          run: cp KaplanKyla_CV.pdf portfolio/public/KaplanKyla_CV.pdf

        - name: Commit and push
          working-directory: portfolio
          run: |
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/KaplanKyla_CV.pdf
            git diff --cached --quiet || git commit -m "chore: update CV from kybeka/cv release ${{ github.ref_name }}"
            git pus
