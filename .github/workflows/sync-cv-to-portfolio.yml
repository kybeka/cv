name: Sync CV to portfolio

"on":
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      SHIP_REPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published CV release tag to sync
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-cv-to-portfolio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download PDF from release
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "KaplanKyla_CV.pdf" \
            --output KaplanKyla_CV.pdf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Checkout ship-of-theseus
        uses: actions/checkout@v4
        with:
          repository: kybeka/ship-of-theseus
          token: ${{ secrets.SHIP_REPO_TOKEN }}
          path: portfolio

      - name: Copy PDF into public/
        run: cp KaplanKyla_CV.pdf portfolio/public/KaplanKyla_CV.pdf

      - name: Commit and push
        working-directory: portfolio
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/KaplanKyla_CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m "chore(cv): update CV from kybeka/cv release $RELEASE_TAG"
            git push
          fi
